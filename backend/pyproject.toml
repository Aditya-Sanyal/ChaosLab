[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoslab"
version = "0.1.0"
description = "Offline attack-path modeling and scenario simulator for security teams"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
pgtest = ["psycopg[binary]>=3.1", "pgserver>=0.1.4"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
chaoslab = "chaoslab.cli:main"

[tool.setuptools.packages.find]
include = ["chaoslab*"]

[tool.setuptools.package-data]
"chaoslab.demo" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
